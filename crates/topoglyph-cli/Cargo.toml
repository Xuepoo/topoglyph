[package]
name = "topoglyph-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for the TopoGlyph topology-to-glyph text-art engine"

[[bin]]
name = "topoglyph"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.4"
topoglyph = { workspace = true }
serde_json = "1.0.151"
rayon = { workspace = true }
terminal_size = "0.4.4"
rodio = { version = "0.22", default-features = false, features = ["mp4", "wav", "playback"] }
indicatif = "0.18.6"

[features]
# video is opt-in: vectomancy-video 7.1.3 (crates.io) links ffmpeg-next 8.1
# (libavutil.so.60) which requires FFmpeg 8 headers unavailable in CI and
# the Docker base image (Debian bookworm ships FFmpeg 5/6). Re-enable once
# vectomancy-video 7.1.4 (ffmpeg-next 9) is published to crates.io and the
# dependency below is bumped to match.
video = ["topoglyph/video"]
