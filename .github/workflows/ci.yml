name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install LLVM/Clang & ALSA (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libasound2-dev

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint with Clippy
        # Exclude topoglyph-video: vectomancy-video 7.1.3 (crates.io) pins
        # ffmpeg-next 8.1 (libavutil.so.60); Ubuntu noble ships FFmpeg 6.1.
        # Re-enable once vectomancy-video 7.1.4 (ffmpeg-next 9) publishes.
        run: |
          cargo clippy --workspace --exclude topoglyph-video --exclude topoglyph-cli -- -D warnings
          cargo clippy -p topoglyph-cli --no-default-features -- -D warnings

      - name: Build
        run: |
          cargo build --workspace --exclude topoglyph-video --exclude topoglyph-cli --verbose
          cargo build -p topoglyph-cli --no-default-features --verbose

      - name: Run tests
        run: |
          cargo test --workspace --exclude topoglyph-video --exclude topoglyph-cli --verbose
          cargo test -p topoglyph-cli --no-default-features --verbose
