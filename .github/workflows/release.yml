name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build Binary for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: topoglyph-linux-x86_64
            arch: amd64
            os_name: linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: topoglyph-linux-aarch64
            arch: arm64
            os_name: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: topoglyph-windows-x86_64.exe
            arch: amd64
            os_name: windows
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: topoglyph-macos-x86_64
            arch: amd64
            os_name: macos
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: topoglyph-macos-aarch64
            arch: arm64
            os_name: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM/Clang & FFmpeg Headers (Linux)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavdevice-dev libavfilter-dev pkg-config

      - name: Install FFmpeg Headers (macOS)
        if: matrix.os_name == 'macos'
        run: |
          brew install ffmpeg pkg-config

      - name: Cache vcpkg binaries
        if: matrix.os_name == 'windows'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install FFmpeg Headers (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
        run: |
          choco install pkgconfiglite -y
          vcpkg integrate install
          vcpkg install ffmpeg:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --bin topoglyph

      - name: Rename artifact (Linux/macOS)
        if: matrix.os_name != 'windows'
        run: mv target/${{ matrix.target }}/release/topoglyph ${{ matrix.artifact_name }}

      - name: Rename artifact (Windows)
        if: matrix.os_name == 'windows'
        run: move target/${{ matrix.target }}/release/topoglyph.exe ${{ matrix.artifact_name }}

      - name: Package for Linux distributions (nfpm)
        if: matrix.os_name == 'linux'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            NFPM_ARCH="arm64"
            PKG_ARCH="aarch64"
          else
            NFPM_ARCH="x86_64"
            PKG_ARCH="x86_64"
          fi
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.37.1/nfpm_2.37.1_Linux_${NFPM_ARCH}.tar.gz | tar xz nfpm
          sed -i "s/amd64/${NFPM_ARCH}/g" nfpm.yaml
          sed -i "s/topoglyph-linux-x86_64/${{ matrix.artifact_name }}/g" nfpm.yaml
          ./nfpm pkg --packager deb --target topoglyph-linux-${PKG_ARCH}.deb
          ./nfpm pkg --packager rpm --target topoglyph-linux-${PKG_ARCH}.rpm
          ./nfpm pkg --packager archlinux --target topoglyph-linux-${PKG_ARCH}.pkg.tar.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            *.deb
            *.rpm
            *.pkg.tar.zst

  release-github:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true

  publish-crates:
    name: Publish to Crates.io
    needs: release-github
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM/Clang & FFmpeg Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavdevice-dev libavfilter-dev pkg-config

      - name: Publish to crates.io
        run: |
          crate_exists() {
            local name=$1
            local version=$2
            curl -H "User-Agent: topoglyph-release-ci" -s -o /dev/null -w "%{http_code}" \
              "https://crates.io/api/v1/crates/$name/$version" | grep -q "^200$"
          }

          wait_for_crate() {
            local name=$1
            local version=$2
            echo "Waiting for $name $version to be available on crates.io..."
            for i in {1..45}; do
              if crate_exists "$name" "$version"; then
                echo "$name $version is now available on crates.io."
                return 0
              fi
              echo "Still waiting ($i/45)... sleeping 10s"
              sleep 10
            done
            echo "Error: Timeout waiting for $name $version to sync on crates.io."
            return 1
          }

          # Publishes $1's manifest at $2 unless that exact name@version is
          # already on crates.io, then waits for it to be resolvable before
          # returning. This makes the whole publish sequence idempotent: if
          # a previous run of this job died partway through (as the initial
          # v0.1.0 attempt did, at the facade step, after core/atlas/output/
          # vectomancy had already published successfully), re-running the
          # workflow for the same tag skips the crates that already exist
          # instead of failing outright with "already exists on crates.io
          # index" on the very first one.
          publish_crate() {
            local name=$1
            local manifest=$2
            local version=$3
            if crate_exists "$name" "$version"; then
              echo "$name $version already exists on crates.io, skipping publish."
              return 0
            fi
            cargo publish --manifest-path "$manifest" --package "$name" --token ${{ secrets.CRATES_TOKEN }} --no-verify --allow-dirty
            wait_for_crate "$name" "$version"
          }

          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "Extracted publish version: $VERSION"

          # Publish order follows the real dependency graph under
          # crates/topoglyph-* (see the workspace Cargo.toml's
          # `[workspace.dependencies]` block): topoglyph-core has no
          # internal dependencies, so it must go first; topoglyph-atlas/
          # -output/-vectomancy each depend only on topoglyph-core;
          # topoglyph-video depends on all four of those plus the facade;
          # the root `topoglyph` facade re-exports the first four; and
          # topoglyph-cli depends on the facade. `publish_crate` blocks
          # until each publish is visible on crates.io before the next one
          # tries to resolve it as a dependency.

          # 1. Publish core (no internal deps)
          publish_crate "topoglyph-core" "crates/topoglyph-core/Cargo.toml" "$VERSION"

          # 2. Publish atlas (depends on core)
          publish_crate "topoglyph-atlas" "crates/topoglyph-atlas/Cargo.toml" "$VERSION"

          # 3. Publish output (depends on core)
          publish_crate "topoglyph-output" "crates/topoglyph-output/Cargo.toml" "$VERSION"

          # 4. Publish vectomancy bridge (depends on core)
          publish_crate "topoglyph-vectomancy" "crates/topoglyph-vectomancy/Cargo.toml" "$VERSION"

          # 5. Publish video (native-only, depends on core/atlas/output/vectomancy).
          # Must come *before* the facade: even though topoglyph-video is an
          # optional dependency of the facade (gated behind the "video"
          # feature), `cargo publish` still needs to resolve it against the
          # registry while packaging the facade's manifest, since it's
          # enabled by the facade's own `default = ["video"]`. Publishing
          # the facade first ("no matching package named `topoglyph-video`
          # found") is exactly what broke the first v0.1.0 release attempt.
          publish_crate "topoglyph-video" "crates/topoglyph-video/Cargo.toml" "$VERSION"

          # 6. Publish the root facade (depends on core/atlas/output/vectomancy/video)
          publish_crate "topoglyph" "Cargo.toml" "$VERSION"

          # 7. Publish cli (depends on the facade)
          publish_crate "topoglyph-cli" "crates/topoglyph-cli/Cargo.toml" "$VERSION"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

  publish-aur:
    name: Publish to AUR
    needs: release-github
    runs-on: ubuntu-latest
    container: archlinux:latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm git openssh pacman-contrib sudo fakeroot binutils make gcc pkgconf

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          # Sync to /root/.ssh for standard ssh client compatibility in containers
          mkdir -p /root/.ssh
          cp -r ~/.ssh/* /root/.ssh/
          chmod 700 /root/.ssh
          chmod 600 /root/.ssh/*

      - name: Configure Git
        run: |
          git config --system --add safe.directory '*'
          git config --global user.name "Xuepoo (CI)"
          git config --global user.email "xuepoofoter@gmail.com"

      - name: Update AUR source package (topoglyph)
        run: |
          git clone ssh://aur@aur.archlinux.org/topoglyph.git aur-src
          cd aur-src
          CLEAN_VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${CLEAN_VERSION#v}
          sed -i "s/^pkgver=.*/pkgver=${CLEAN_VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${CLEAN_VERSION}" || true
          git push origin master

      - name: Update AUR binary package (topoglyph-bin)
        run: |
          git clone ssh://aur@aur.archlinux.org/topoglyph-bin.git aur-bin
          cd aur-bin
          CLEAN_VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${CLEAN_VERSION#v}
          sed -i "s/^pkgver=.*/pkgver=${CLEAN_VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${CLEAN_VERSION}" || true
          git push origin master

  sync-brew:
    name: Sync Brew Formula
    needs: release-github
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v7.0.1
        with:
          repository: Xuepoo/homebrew-tap
          token: ${{ secrets.GH_PAT }}
          path: homebrew-tap

      - name: Update Formula
        run: |
          VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${VERSION#v}
          curl -sL -O "https://github.com/Xuepoo/topoglyph/releases/download/${VERSION}/topoglyph-macos-x86_64"
          curl -sL -O "https://github.com/Xuepoo/topoglyph/releases/download/${VERSION}/topoglyph-macos-aarch64"
          SHA_INTEL=$(sha256sum topoglyph-macos-x86_64 | awk '{print $1}')
          SHA_ARM=$(sha256sum topoglyph-macos-aarch64 | awk '{print $1}')

          mkdir -p homebrew-tap/Formula
          cat << EOF > homebrew-tap/Formula/topoglyph.rb
          class Topoglyph < Formula
            desc "Topology-to-glyph text-art rendering engine"
            homepage "https://github.com/Xuepoo/topoglyph"
            version "${CLEAN_VERSION}"

            if OS.mac? && Hardware::CPU.intel?
              url "https://github.com/Xuepoo/topoglyph/releases/download/${VERSION}/topoglyph-macos-x86_64"
              sha256 "${SHA_INTEL}"
            elsif OS.mac? && Hardware::CPU.arm?
              url "https://github.com/Xuepoo/topoglyph/releases/download/${VERSION}/topoglyph-macos-aarch64"
              sha256 "${SHA_ARM}"
            end

            def install
              bin.install "topoglyph-macos-x86_64" => "topoglyph" if Hardware::CPU.intel?
              bin.install "topoglyph-macos-aarch64" => "topoglyph" if Hardware::CPU.arm?
            end

            test do
              system "#{bin}/topoglyph", "--version"
            end
          end
          EOF

          cd homebrew-tap
          git config user.name "Xuepoo (CI)"
          git config user.email "xuepoofoter@gmail.com"
          git add Formula/topoglyph.rb
          git commit -m "Update Topoglyph to ${CLEAN_VERSION}" || true
          git push origin main

  sync-scoop:
    name: Sync Scoop Manifest
    needs: release-github
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout scoop repository
        uses: actions/checkout@v7.0.1
        with:
          repository: Xuepoo/scoop-bucket
          token: ${{ secrets.GH_PAT }}
          path: scoop-bucket

      - name: Update Manifest
        run: |
          VERSION=${{ github.ref_name }}
          CLEAN_VERSION=${VERSION#v}
          curl -sL -O "https://github.com/Xuepoo/topoglyph/releases/download/${VERSION}/topoglyph-windows-x86_64.exe"
          SHA_WIN=$(sha256sum topoglyph-windows-x86_64.exe | awk '{print $1}')

          mkdir -p scoop-bucket/bucket
          cat << EOF > scoop-bucket/bucket/topoglyph.json
          {
            "version": "${CLEAN_VERSION}",
            "description": "Topology-to-glyph text-art rendering engine",
            "homepage": "https://github.com/Xuepoo/topoglyph",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "https://github.com/Xuepoo/topoglyph/releases/download/${VERSION}/topoglyph-windows-x86_64.exe",
                "hash": "${SHA_WIN}"
              }
            },
            "bin": "topoglyph-windows-x86_64.exe",
            "checkver": {
              "github": "https://github.com/Xuepoo/topoglyph"
            }
          }
          EOF

          cd scoop-bucket
          git config user.name "Xuepoo (CI)"
          git config user.email "xuepoofoter@gmail.com"
          git add bucket/topoglyph.json
          git commit -m "Update Topoglyph to ${CLEAN_VERSION}" || true
          git push origin main
